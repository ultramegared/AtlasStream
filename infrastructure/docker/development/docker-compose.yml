version: "3.9"

name: atlasstream-dev

services:
  postgres:
    image: postgres:17
    container_name: atlasstream-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: atlasstream
      POSTGRES_USER: atlasstream
      POSTGRES_PASSWORD: atlasstream

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlasstream"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: atlasstream-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: